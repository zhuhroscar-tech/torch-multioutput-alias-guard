[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-multioutput-alias-guard"
version = "0.1.0"
description = "Guards a real PyTorch correctness bug class: multi-output ops (torch.aminmax, torch.linalg.slogdet) silently return wrong results when the SAME tensor is passed for two different out= slots, because their meta functions never call assert_no_overlap the way kthvalue/cross already do"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-multioutput-alias-guard = "torch_multioutput_alias_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
